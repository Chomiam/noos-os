<svg xmlns="http://www.w3.org/2000/svg" viewBox="22 22 156 156" width="512" height="512">
  <defs>
    <!-- Dégradé lumineux élégant (Bleu saphir / Lavande / Rose doux) -->
    <linearGradient id="infinityGlow" gradientUnits="userSpaceOnUse" x1="30" y1="15" x2="180" y2="95">
      <stop offset="0%" stop-color="#89b4fa" />
      <stop offset="50%" stop-color="#cba6f7" />
      <stop offset="100%" stop-color="#f38ba8" />
    </linearGradient>

    <!-- Léger halo lumineux néon -->
    <filter id="neonBlur" filterUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Rail discret de base pour l'infini */
    .inf-track {
      fill: none;
      stroke: #36394e;
      stroke-width: 13;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Double pulsation fluide le long du lemniscate */
    .inf-beam-primary {
      fill: none;
      stroke: url(#infinityGlow);
      stroke-width: 13;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 110 330;
      stroke-dashoffset: -35;
      animation: loopOrbitPrimary 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .inf-beam-secondary {
      fill: none;
      stroke: url(#infinityGlow);
      stroke-width: 13;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 55 385;
      stroke-dashoffset: -255;
      opacity: 0.85;
      animation: loopOrbitSecondary 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes loopOrbitPrimary {
      0% { stroke-dashoffset: -35; }
      100% { stroke-dashoffset: -475; }
    }

    @keyframes loopOrbitSecondary {
      0% { stroke-dashoffset: -255; }
      100% { stroke-dashoffset: -695; }
    }
  </style>

  <!-- Rail de guidage incliné à 45 degrés -->
  <g transform="translate(-5, 45) rotate(-45, 105, 55)">
    <path class="inf-track" fill="none" stroke="#36394e" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" d="M 105,55 C 135,15 180,15 180,55 C 180,95 135,95 105,55 C 75,15 30,15 30,55 C 30,95 75,95 105,55 Z" />
  </g>

  <!-- Impulsions lumineuses synchronisées -->
  <g filter="url(#neonBlur)">
    <g transform="translate(-5, 45) rotate(-45, 105, 55)">
      <path class="inf-beam-primary" fill="none" stroke="url(#infinityGlow)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="110 330" stroke-dashoffset="-35" d="M 105,55 C 135,15 180,15 180,55 C 180,95 135,95 105,55 C 75,15 30,15 30,55 C 30,95 75,95 105,55 Z" />
      <path class="inf-beam-secondary" fill="none" stroke="url(#infinityGlow)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="55 385" stroke-dashoffset="-255" opacity="0.85" d="M 105,55 C 135,15 180,15 180,55 C 180,95 135,95 105,55 C 75,15 30,15 30,55 C 30,95 75,95 105,55 Z" />
    </g>
  </g>
</svg>
