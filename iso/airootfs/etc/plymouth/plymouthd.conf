# Selects the noos-os splash.
#
# Plymouth reads the theme from here rather than from a build-time default,
# so the theme travels with the ISO instead of depending on
# `plymouth-set-default-theme` having been run at build time.

[Daemon]
Theme=noos
# Show the splash immediately: there is no flicker to hide here, and a delay
# only makes the boot look slower than it is.
ShowDelay=0
