# Kept in sync with installer/core/src/powersave.rs.
#
# Disables Wi-Fi power saving.
#
# The driver re-enables it on every association, so this has to be handled by
# whatever manages the connection rather than by a one-shot command at boot.
#
# On the live medium systemd-networkd manages wired links and iwd the
# wireless ones, so this file has no effect there — it is shipped so that the
# installed system's configuration is present in the same shape as everything
# else, and because NetworkManager is what the installed system uses.

[connection]
wifi.powersave = 2
