# mkinitcpio configuration for the live medium.
#
# Replaces the target-oriented hooks from the linux package with the archiso
# set. `archiso` is the hook that locates and mounts airootfs.sfs; without it
# the medium drops to a rescue shell.
#
# The PXE and loop-mount hooks releng carries are omitted: this medium is only
# ever booted from the removable it was written to.
#
# `plymouth` sits directly after `udev` so the splash covers the screen from
# the earliest possible moment. It has to come before `archiso`, which is what
# mounts the squashfs — that mount takes several seconds on optical media, and
# without the splash those seconds are a blank screen.

HOOKS=(base udev plymouth microcode modconf kms memdisk archiso block filesystems keyboard)

COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19)
