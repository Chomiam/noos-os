#
# Live medium locale. The installed system gets its own, chosen in the
# installer; this only affects the live environment.
#
# en_US.UTF-8 is generated by etc/pacman.d/hooks/locale-gen.hook — glibc
# generates no locale on its own, and without one the UI and pacman output
# mangle non-ASCII text.

LANG=en_US.UTF-8
