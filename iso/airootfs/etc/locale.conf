#
# Live medium locale. The installed system gets its own, chosen in the
# installer; this only affects the live environment.
#
# **`C.UTF-8`, and not `en_US.UTF-8`.** The hook that was supposed to generate
# `en_US.UTF-8` does not take effect: the built medium has no
# `/usr/lib/locale/` at all, so the environment claimed a locale that did not
# exist and every command run inside `arch-chroot` opened with
# `Failed to set locale.` — the same message, and the same class of bug, as the
# one fixed on the target. Here it appears during installation, where it reads
# as a failure.
#
# `C.UTF-8` is built into glibc and needs no generation, and it is UTF-8, so
# nothing is lost: console output, pacman and the installer's own text all
# render as before.
#
# The hook is left in place — harmless, and it would give the medium a richer
# locale if it ever takes effect.

LANG=C.UTF-8
