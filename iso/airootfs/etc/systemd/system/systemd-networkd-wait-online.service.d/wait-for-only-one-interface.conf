# Kept from the releng profile.
#
# Without this, `wait-online` waits for *every* interface to be configured. A
# machine with a wireless card that is not associated would make it wait out
# its full timeout — two minutes — before anything else could start.
#
# Waiting for one working interface is what the boot actually needs.

[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any
