# iwd configuration for the live medium.
#
# iwd handles the 802.11 association; systemd-networkd handles the IP
# configuration. The split matters: with iwd's default
# (EnableNetworkConfiguration=true) both iwd and networkd would try to run
# DHCP on the same interface, and which one wins is a race. Turning it off
# leaves exactly one thing doing each job — iwd associates, networkd
# configures — which is also what the installed system does.
#
# The wireless profile in /etc/systemd/network/20-wlan.network is what
# networkd uses, so the two halves are wired together by that file.

[General]
EnableNetworkConfiguration=false

# Ask before exposing the MAC address in scans.
#
# Network names are a decent indicator of where a machine is, and a live
# medium is often used somewhere public. Randomising the address during a scan
# is the default in recent iwd; stating it keeps the behaviour explicit.
[Scan]
DisablePeriodicScan=false

[Network]
# Do not let iwd write /etc/resolv.conf: systemd-resolved owns it, and two
# writers would clobber each other.
EnableIPv6=false
