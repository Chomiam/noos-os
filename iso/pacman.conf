#
# pacman configuration for building the live environment.
#
# Mirrors the releng profile. The mirrorlist lives in airootfs, not here: this
# file configures the pacstrap of the airootfs itself, while the live system's
# own mirrorlist is what the installer's pacstrap will later use.

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# The binary AUR repository. Two packages this distribution needs build a
# GraalVM native image, whose build fails under makepkg — see
# installer/core/src/chaotic.rs for what that costs and why it is still the
# right trade.
#
# Present in *this* file so mkarchiso can install chaotic-keyring into the live
# environment: the live keyring is what pacstrap copies into the target, and it
# is what makes the target trust the repository from its first pacman call.
#
# The Include resolves on the build host, not in the profile — so the host needs
# chaotic-mirrorlist installed, which scripts/build-iso.sh does.
[chaotic-aur]
Include = /etc/pacman.d/chaotic-mirrorlist
