#
# pacman configuration for building the live environment.
#
# Mirrors the releng profile. The mirrorlist lives in airootfs, not here: this
# file configures the pacstrap of the airootfs itself, while the live system's
# own mirrorlist is what the installer's pacstrap will later use.

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
