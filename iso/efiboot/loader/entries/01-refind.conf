# The only entry systemd-boot has, and it boots nothing itself.
#
# It hands control to rEFInd, which is what presents the menu and loads the
# kernel. The path is relative to the EFI image's root — the FAT filesystem
# systemd-boot was launched from, which is the only one it can read.
#
# No kernel, no initrd and no options here on purpose: those live in rEFInd's
# own configuration, where they are visible and editable at the menu that
# actually appears.

title    noos-os
sort-key 01
efi      /EFI/refind/refind_x64.efi
