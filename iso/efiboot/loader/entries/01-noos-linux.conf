title    noos-os live (%ARCH%)
sort-key 01
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
# archisobasedir tells the archiso hook where to find airootfs.sfs, and
# archisosearchuuid tells it which volume to look on. Both are required: the
# medium is not necessarily the first disk, and the label is not unique.
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
