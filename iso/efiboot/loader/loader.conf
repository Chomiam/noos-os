# systemd-boot configuration for the live medium.
#
# mkarchiso substitutes %INSTALL_DIR%, %ARCHISO_UUID%, %ARCH% and
# %KERNEL_PARAMS% before copying this into the ISO.

timeout 5
default 01-noos-linux.conf

# The command line is editable at the menu.
#
# This was disabled at first, on the reasoning that a user could break the boot
# by editing it. That trade is wrong for a live medium: the cmdline is the
# only lever available when something goes wrong before the system is up, and
# the Plymouth splash is exactly the kind of thing that can hang a boot. Being
# able to add `plymouth.enable=0` at the menu is worth more than preventing a
# mistyped parameter.
editor 1
