# systemd-boot, reduced to a hand-off.
#
# rEFInd is the live medium's real boot manager, but mkarchiso has no rEFInd
# bootmode: the modes it knows are bios.syslinux*, uefi.grub and
# uefi.systemd-boot, and it reads only `loader.conf` and `entries/` out of a
# profile — there is no way to hand it extra EFI files. So systemd-boot is built
# as usual, because it is what produces a valid UEFI image, and its single entry
# chainloads rEFInd, which then draws the menu.
#
# `timeout 0` is what makes the hand-off invisible: systemd-boot boots its
# default entry without ever showing a menu, so the first thing on screen is
# rEFInd's theme.
#
# `editor 0` because there is no menu to edit from. The command line stays
# reachable — rEFInd has an options editor of its own (press F2 on an entry) —
# so the recovery lever described below is preserved, just moved.

timeout 0
default 01-refind.conf
editor 0
