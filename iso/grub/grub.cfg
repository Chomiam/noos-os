# Load partition table, filesystem and graphics modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod btrfs
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf
insmod all_video
insmod font
insmod gfxterm
insmod gfxmenu
insmod png
insmod jpeg

# Load fonts and activate the WhiteSur graphical theme
if loadfont "${prefix}/fonts/unicode.pf2" ; then
    for font in /boot/grub/themes/whitesur/*.pf2 "${prefix}/themes/whitesur/"*.pf2 ; do
        if [ -f "${font}" ]; then
            loadfont "${font}"
        fi
    done
    set gfxmode="1920x1080,auto"
    set gfxpayload=keep
    terminal_input console
    terminal_output gfxterm
    if [ -f "/boot/grub/themes/whitesur/theme.txt" ]; then
        set theme="/boot/grub/themes/whitesur/theme.txt"
        export theme
    elif [ -f "${prefix}/themes/whitesur/theme.txt" ]; then
        set theme="${prefix}/themes/whitesur/theme.txt"
        export theme
    fi
fi

# Enable serial console when present
insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

# Set default menu entry
default=noos-os
timeout=5
timeout_style=menu

menuentry "noos-os live" --class noos-os --class arch --class gnu-linux --class gnu --class os --id 'noos-os' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archisolabel=%ARCHISO_LABEL% %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" == 'efi' ]; then
    if [ -f '/shellx64.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellx64.efi
        }
    fi

    menuentry 'UEFI Firmware Settings' --class efi --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System restart' --class restart --class reboot {
    echo 'System rebooting...'
    reboot
}

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}
