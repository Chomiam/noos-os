[package]
name = "noos-core"
version = "0.1.0"
edition = "2024"
description = "noos-os installation engine: partitioning, btrfs, limine, snapshots"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
zxcvbn = "3"

[[bin]]
name = "noos-install"
path = "src/bin/noos-install.rs"
